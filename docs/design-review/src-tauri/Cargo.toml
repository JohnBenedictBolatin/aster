[package]
name = "aster-desktop"
version = "0.2.0"
description = "Aster offline astronaut health demonstration"
authors = ["Aster demo"]
edition = "2021"

[lib]
name = "aster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
btleplug = "0.11"
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time"] }
uuid = "1"
